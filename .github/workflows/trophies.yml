name: Update GitHub Trophies

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ryo-ma/github-profile-trophy@master
        with:
          user: santhoshkannan-dev
          theme: tokyonight
          no-frame: true
          no-bg: true
          row: 1
          column: 6
          output: assets/trophies.svg
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update GitHub profile trophies"
